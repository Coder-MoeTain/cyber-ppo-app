name: Research MARL CI

on:
  push:
    branches:
      - research/marl-autonomous-cyber-defense
    paths:
      - "research/marl-autonomous-cyber-defense/**"
      - ".github/workflows/research-marl-ci.yml"
  pull_request:
    paths:
      - "research/marl-autonomous-cyber-defense/**"
      - ".github/workflows/research-marl-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-marl-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-and-static:
    name: Unit tests and compile (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: research/marl-autonomous-cyber-defense
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: research/marl-autonomous-cyber-defense/pyproject.toml
      - name: Install research package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile source, scripts and tests
        run: python -m compileall -q src scripts tests
      - name: Validate experiment shell scripts
        run: bash -n scripts/run_standard_cc4_matrix.sh scripts/run_cc4_ablations.sh
      - name: Run unit and regression tests
        run: python -m pytest -q
