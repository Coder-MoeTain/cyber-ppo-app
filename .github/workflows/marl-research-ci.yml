name: MARL research scaffold checks

on:
  push:
    branches:
      - research/marl-autonomous-cyber-defense
  pull_request:
  workflow_dispatch:

jobs:
  mock-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/marl-autonomous-cyber-defense
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: research/marl-autonomous-cyber-defense/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Mock environment smoke test
        run: python scripts/phase1_smoke_test.py
      - name: Mock MAPPO training smoke test (not CybORG)
        run: python scripts/train_mock_mappo.py --episodes 2 --seed 42
