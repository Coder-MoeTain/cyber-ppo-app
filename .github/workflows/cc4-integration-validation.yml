name: Official CAGE Challenge 4 integration validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/marl-autonomous-cyber-defense
    paths:
      - "research/marl-autonomous-cyber-defense/src/autocd/envs/**"
      - "research/marl-autonomous-cyber-defense/scripts/validate_cyborg.py"
      - "research/marl-autonomous-cyber-defense/tests/test_cyborg_adapter.py"
      - "research/marl-autonomous-cyber-defense/configs/cc4.lock.yaml"
      - "research/marl-autonomous-cyber-defense/requirements-cc4-validation.txt"
      - ".github/workflows/cc4-integration-validation.yml"

jobs:
  cc4-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: research/marl-autonomous-cyber-defense
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned official CAGE Challenge 4 source
        uses: actions/checkout@v4
        with:
          repository: cage-challenge/cage-challenge-4
          ref: 8c3c50ca54b176c2de199847944e8dcc035497e3
          path: research/marl-autonomous-cyber-defense/vendor/CybORG
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: research/marl-autonomous-cyber-defense/requirements-cc4-validation.txt
      - name: Install pinned simulator runtime dependencies
        run: python -m pip install -r requirements-cc4-validation.txt
      - name: Install exact CAGE Challenge 4 simulator source
        run: python -m pip install --no-deps -e vendor/CybORG
      - name: Install research package without replacing simulator dependencies
        run: python -m pip install --no-deps -e .
      - name: Validate official upstream CC4 tests
        run: python -m pytest -q vendor/CybORG/CybORG/Tests/test_cc4 --disable-warnings --maxfail=1
      - name: Validate adapter reset, action masks, seed replay and one real step
        run: python scripts/validate_cyborg.py --one-step --verify-seed
