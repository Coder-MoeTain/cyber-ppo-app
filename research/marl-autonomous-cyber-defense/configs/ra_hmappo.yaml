project:
  name: risk-aware-hierarchical-marl-cyber-defense
  version: 0.5.0
  benchmark: CAGE-Challenge-4
  environment: CybORG
  cyborg_commit: 8c3c50ca54b176c2de199847944e8dcc035497e3
  seed: 42
agents:
  names: [blue_agent_0, blue_agent_1, blue_agent_2, blue_agent_3, blue_agent_4]
  observation_wrapper: BlueFlatWrapper
  pad_spaces: true
  action_masking: true
hierarchy:
  manager: decentralized_risk_conditioned_task_policy
  worker: decentralized_risk_and_task_conditioned_action_policy
  critic: centralized_global_state_value
  num_tasks: 6
  action_mapper: CC4TaskActionMapper
  task_ontology:
    - monitor
    - investigate
    - remediate
    - recover
    - isolate
    - deceive
  risk_input:
    range: [0.0, 1.0]
    source: offline_supervised_local_observation_model
    checkpoint: artifacts/cc4_risk.pt
algorithm:
  name: RA-HMAPPO
  status: trainer_implemented_live_cc4_validation_pending
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  learning_rate: 0.0003
  update_epochs: 4
  minibatch_size: 64
  manager_entropy_coefficient: 0.01
  worker_entropy_coefficient: 0.01
  value_coefficient: 0.5
experiment:
  episode_steps: 500
  total_environment_steps: 1000000
  training_seeds: [11, 22, 33, 44, 55, 66, 77, 88, 99, 111]
  evaluation_seeds: [501, 502, 503, 504, 505, 506, 507, 508, 509, 510, 511, 512, 513, 514, 515, 516, 517, 518, 519, 520, 521, 522, 523, 524, 525, 526, 527, 528, 529, 530, 531, 532, 533, 534, 535, 536, 537, 538, 539, 540, 541, 542, 543, 544, 545, 546, 547, 548, 549, 550, 551, 552, 553, 554, 555, 556, 557, 558, 559, 560, 561, 562, 563, 564, 565, 566, 567, 568, 569, 570, 571, 572, 573, 574, 575, 576, 577, 578, 579, 580, 581, 582, 583, 584, 585, 586, 587, 588, 589, 590, 591, 592, 593, 594, 595, 596, 597, 598, 599, 600]
  publication_evaluation_enabled: false
