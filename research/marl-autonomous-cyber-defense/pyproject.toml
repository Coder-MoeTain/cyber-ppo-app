[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-autonomous-cyber-defense"
version = "0.4.0"
description = "Risk-conditioned hierarchical MARL cyber defense research package"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6.0", "torch>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
